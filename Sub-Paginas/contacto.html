        <h2>Contactenos para consultar sobre la ciudad </h2>
        <div class="row g-4">
            <form>
                    <div class="row">
                        <label for="Nombre"> Nombre Completo</label>
                        <div class="col">
                            <input type="text" class="form-control" placeholder="Nombre" id="Nombre">
                        </div>
                        <div class="col">
                            <input type="text" class="form-control" placeholder="Apellido">
                        </div>
                    </div>
                <div class="form-group">
                    <label for="Edad"> Edad </label>
                    <input type="number" class="form-control" id="Edad" placeholder="Edad">
                </div>
                <div class="form-group">
                    <label for="exampleFormControlInput1">Dirección de correo electrónico</label>
                    <input type="email" class="form-control" id="exampleFormControlInput1"
                        placeholder="nombre@ejemplo.com">
                </div>
                <div class="form-group">
                    <label for="exampleFormControlSelect1">Motivo de su contacto</label>
                    <select class="form-control" id="exampleFormControlSelect1">
                        <option value="" disabled selected hidden>Seleccione una opción</option>
                        <option value="Recorrido">Recorrido turístico</option>
                        <option value="Inscripcción">Inscripcción a actividad</option>
                        <option value="Alquileres2">Alquileres a corto plazo</option>
                        <option value="Alquileres1">Alquileres a largo plazo</option>
                        <option value="Otro">Otro</option>
                    </select>
                </div>
                <!-- Campo de texto oculto que aparecerá al elegir "Otro" -->
                <div class="form-group" id="campoOtro" style="display: none;">
                    <label for="descripcionOtro">Motivo de contacto</label>
                    <input type="text" class="form-control" id="descripcionOtro">
                </div>
            </form>
            <br>
        </div>
        <button type="button" class="btn btn-primary btn-lg btn-block" id="btn-enviar">Enviar </button>
